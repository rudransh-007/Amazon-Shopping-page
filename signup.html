<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazon Registration (Clone)</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<a href="index.html" class="logo">amazon<span>.in</span></a>
<div class="auth-box">
  <h1>Create account</h1>
  <div class="success" id="success">Account created (demo only &ndash; no backend).</div>
  <form id="authForm" novalidate>
    <div><label for="name">Your name</label><input type="text" id="name" placeholder="First and last name" data-rule="required"><div class="error"></div></div>
    <div><label for="email">Email</label><input type="email" id="email" data-rule="email"><div class="error"></div></div>
    <div><label for="password">Password</label><input type="password" id="password" placeholder="At least 6 characters" data-rule="password"><div class="error"></div><div class="hint">&#9432; Passwords must be at least 6 characters.</div></div>
    <div><label for="confirm">Re-enter password</label><input type="password" id="confirm" data-rule="match"><div class="error"></div></div>
    <button class="btn" type="submit">Continue</button>
  </form>
  <p class="small">By creating an account, you agree to Amazon's <a href="#">Conditions of Use</a> and <a href="#">Privacy Notice</a>.</p>
  <p class="small">Already have an account? <a href="login.html">Sign in</a></p>
</div>
<div class="auth-footer"><a href="#">Conditions of Use</a><a href="#">Privacy Notice</a><a href="#">Help</a></div>
<script src="script.js"></script>
</body>
</html>
