<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazon Sign In (Clone)</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<a href="index.html" class="logo">amazon<span>.in</span></a>
<div class="auth-box">
  <h1>Sign in</h1>
  <div class="success" id="success">Signed in (demo only &ndash; no backend).</div>
  <form id="authForm" novalidate>
    <div><label for="email">Email</label><input type="email" id="email" data-rule="email"><div class="error"></div></div>
    <div><label for="password">Password</label><input type="password" id="password" data-rule="required"><div class="error"></div></div>
    <button class="btn" type="submit">Sign in</button>
  </form>
  <p class="small">By continuing, you agree to Amazon's <a href="#">Conditions of Use</a> and <a href="#">Privacy Notice</a>.</p>
  <p class="small"><a href="#">Forgot your password?</a></p>
</div>
<div class="divider"><span>New to Amazon?</span></div>
<a class="btn-light" href="signup.html">Create your Amazon account</a>
<div class="auth-footer"><a href="#">Conditions of Use</a><a href="#">Privacy Notice</a><a href="#">Help</a></div>
<script src="script.js"></script>
</body>
</html>
